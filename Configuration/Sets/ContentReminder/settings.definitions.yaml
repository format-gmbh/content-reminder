categories:
  contentReminder: ~
  contentReminder.mail:
    parent: contentReminder
  contentReminder.stale:
    parent: contentReminder

settings:
  contentReminder.assignableGroups:
    default: ''
    type: string
    category: contentReminder
  contentReminder.backendUrl:
    default: ''
    type: string
    category: contentReminder

  contentReminder.mail.enabled:
    default: true
    type: bool
    category: contentReminder.mail
  contentReminder.mail.weekday:
    default: 'monday'
    type: string
    category: contentReminder.mail
    enum:
      - 'monday'
      - 'tuesday'
      - 'wednesday'
      - 'thursday'
      - 'friday'
      - 'saturday'
      - 'sunday'
  contentReminder.mail.lookaheadDays:
    default: 7
    type: int
    category: contentReminder.mail
  contentReminder.mail.fromAddress:
    default: ''
    type: string
    category: contentReminder.mail
  contentReminder.mail.fromName:
    default: ''
    type: string
    category: contentReminder.mail
  contentReminder.mail.unassignedRecipient:
    default: ''
    type: string
    category: contentReminder.mail

  contentReminder.stale.enabled:
    default: false
    type: bool
    category: contentReminder.stale
  contentReminder.stale.months:
    default: 24
    type: int
    category: contentReminder.stale
  contentReminder.stale.excludePages:
    default: ''
    type: string
    category: contentReminder.stale
  contentReminder.stale.limit:
    default: 50
    type: int
    category: contentReminder.stale
