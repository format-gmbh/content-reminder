name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3: '^13.4'
            php: '8.2'
          - typo3: '^13.4'
            php: '8.4'
          - typo3: '^14.0'
            php: '8.2'
          - typo3: '^14.0'
            php: '8.4'

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: >-
          composer update --no-progress --no-interaction
          --with "typo3/cms-core:${{ matrix.typo3 }}"
          --with "typo3/cms-backend:${{ matrix.typo3 }}"
          --with "typo3/cms-dashboard:${{ matrix.typo3 }}"
          --with "typo3/cms-scheduler:${{ matrix.typo3 }}"
          --with "typo3/cms-setup:${{ matrix.typo3 }}"

      - name: PHPStan
        run: composer phpstan -- --no-progress

      - name: Unit tests
        run: composer test:unit

      - name: Functional tests
        run: composer test:functional
        env:
          typo3DatabaseDriver: mysqli
          typo3DatabaseHost: 127.0.0.1
          typo3DatabasePort: 3306
          typo3DatabaseUsername: root
          typo3DatabasePassword: root
          typo3DatabaseName: ft_content_reminder
