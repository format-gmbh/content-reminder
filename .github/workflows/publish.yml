name: Publish to TER

# Publishes a new version to the TYPO3 Extension Repository when a version tag
# like "1.2.3" is pushed. The annotated tag message is used as upload comment.
# Requires the repository secret TYPO3_API_TOKEN (created at extensions.typo3.org).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: content_reminder
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version and comment from tag
        id: tag
        run: |
          version="${GITHUB_REF#refs/tags/}"
          git fetch --tags --force
          comment="$(git tag -l --format='%(contents)' "$version" | sed -e '/^-----BEGIN/,$d' | tr '\n' ' ' | sed -e 's/[[:space:]]*$//')"
          if [ -z "$comment" ]; then
            comment="Released version $version of content_reminder"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "comment<<EOF"
            echo "$comment"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the extension version
        run: |
          grep -q "'version' => '${{ steps.tag.outputs.version }}'" ext_emconf.php \
            || { echo "ext_emconf.php does not contain version ${{ steps.tag.outputs.version }}"; exit 1; }
          grep -q '"version": "${{ steps.tag.outputs.version }}"' composer.json \
            || { echo "composer.json does not contain version ${{ steps.tag.outputs.version }}"; exit 1; }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install Tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        run: |
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish \
            --comment "${{ steps.tag.outputs.comment }}" \
            "${{ steps.tag.outputs.version }}"
