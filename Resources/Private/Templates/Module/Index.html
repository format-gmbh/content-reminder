<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <f:variable name="ll" value="LLL:EXT:content_reminder/Resources/Private/Language/locallang_be.xlf:" />

    <h1>
        <f:translate key="{ll}module.title" />:
        <f:if condition="{pageTitle}">
            <f:then>{pageTitle}</f:then>
            <f:else><f:translate key="{ll}module.allPages" /></f:else>
        </f:if>
    </h1>

    <div class="content-reminder-module-toolbar">
        <div class="btn-group" role="group">
            <a href="{viewUrls.reminders}" class="btn btn-default{f:if(condition: '{filters.view} == \'reminders\'', then: ' active')}">
                <core:icon identifier="content-reminder-reminder" size="small" />
                <f:translate key="{ll}module.view.reminders" />
            </a>
            <a href="{viewUrls.archive}" class="btn btn-default{f:if(condition: '{filters.view} == \'archive\'', then: ' active')}">
                <core:icon identifier="actions-history" size="small" />
                <f:translate key="{ll}module.view.archive" />
            </a>
        </div>
        <f:if condition="{newUrl}">
            <a href="{newUrl}" class="btn btn-default">
                <core:icon identifier="actions-plus" size="small" />
                <f:translate key="{ll}panel.new" />
            </a>
        </f:if>
    </div>

    <form action="{formAction.path}" method="get" class="content-reminder-module-filter">
        <f:for each="{formAction.parameters}" as="value" key="name">
            <input type="hidden" name="{name}" value="{value}" />
        </f:for>

        <f:if condition="{pageUid}">
            <div class="form-group">
                <label class="form-label" for="content-reminder-depth"><f:translate key="{ll}module.filter.depth" /></label>
                <select class="form-select" id="content-reminder-depth" name="depth">
                    <f:for each="{filterOptions.depth}" as="option">
                        <option value="{option}" {f:if(condition: '{filters.depth} == {option}', then: 'selected')}><f:translate key="{ll}module.filter.depth.{option}" /></option>
                    </f:for>
                </select>
            </div>
        </f:if>

        <div class="form-group">
            <label class="form-label" for="content-reminder-assignee">
                <f:if condition="{filters.view} == 'archive'">
                    <f:then><f:translate key="{ll}module.filter.completedBy" /></f:then>
                    <f:else><f:translate key="{ll}module.filter.assignee" /></f:else>
                </f:if>
            </label>
            <select class="form-select" id="content-reminder-assignee" name="assignee">
                <option value="all" {f:if(condition: '{filters.assignee} == \'all\'', then: 'selected')}><f:translate key="{ll}module.filter.assignee.all" /></option>
                <option value="me" {f:if(condition: '{filters.assignee} == \'me\'', then: 'selected')}><f:translate key="{ll}module.filter.assignee.me" /></option>
                <f:if condition="{filters.view} == 'reminders'">
                    <option value="unassigned" {f:if(condition: '{filters.assignee} == \'unassigned\'', then: 'selected')}><f:translate key="{ll}module.filter.assignee.unassigned" /></option>
                </f:if>
                <option disabled>──────────</option>
                <f:for each="{users}" as="name" key="uid">
                    <option value="{uid}" {f:if(condition: '{filters.assignee} == {uid}', then: 'selected')}>{name}</option>
                </f:for>
            </select>
        </div>

        <f:if condition="{filters.view} == 'archive'">
            <f:then>
                <div class="form-group">
                    <label class="form-label" for="content-reminder-period"><f:translate key="{ll}module.filter.period" /></label>
                    <select class="form-select" id="content-reminder-period" name="period">
                        <f:for each="{filterOptions.period}" as="option">
                            <option value="{option}" {f:if(condition: '{filters.period} == {option}', then: 'selected')}><f:translate key="{ll}module.filter.period.{option}" /></option>
                        </f:for>
                    </select>
                </div>
            </f:then>
            <f:else>
                <div class="form-group">
                    <label class="form-label" for="content-reminder-state"><f:translate key="{ll}module.filter.state" /></label>
                    <select class="form-select" id="content-reminder-state" name="state">
                        <f:for each="{filterOptions.state}" as="option">
                            <option value="{option}" {f:if(condition: '{filters.state} == {option}', then: 'selected')}><f:translate key="{ll}module.filter.state.{option}" /></option>
                        </f:for>
                    </select>
                </div>
            </f:else>
        </f:if>

        <div class="form-group">
            <button type="submit" class="btn btn-default">
                <core:icon identifier="actions-filter" size="small" />
                <f:translate key="{ll}module.filter.apply" />
            </button>
        </div>
    </form>

    <f:if condition="{limitReached}">
        <f:be.infobox state="1"><f:translate key="{ll}module.limitReached" arguments="{0: limit}" /></f:be.infobox>
    </f:if>

    <f:if condition="{filters.view} == 'archive'">
        <f:then><f:render section="Archive" arguments="{_all}" /></f:then>
        <f:else><f:render section="Reminders" arguments="{_all}" /></f:else>
    </f:if>
</f:section>

<f:section name="Reminders">
    <f:if condition="{items}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="{ll}module.column.title" /></th>
                            <th><f:translate key="{ll}module.column.page" /></th>
                            <th><f:translate key="{ll}module.column.dueDate" /></th>
                            <th><f:translate key="{ll}module.column.recurrence" /></th>
                            <th><f:translate key="{ll}module.column.assignee" /></th>
                            <th><f:translate key="{ll}module.column.state" /></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{items}" as="item">
                            <tr>
                                <td>
                                    <strong>{item.reminder.title}</strong>
                                    <f:if condition="{item.reminder.notes}">
                                        <div class="content-reminder-item__notes">{item.reminder.notes -> f:format.crop(maxCharacters: 120)}</div>
                                    </f:if>
                                </td>
                                <td><a href="{item.layoutUrl}">{item.pageTitle}</a></td>
                                <td class="text-nowrap">
                                    <f:if condition="{item.dueDate}">
                                        <f:then>{item.dueDate}</f:then>
                                        <f:else>–</f:else>
                                    </f:if>
                                </td>
                                <td>{item.recurrence}</td>
                                <td>
                                    <f:if condition="{item.assigneeName}">
                                        <f:then>{item.assigneeName}</f:then>
                                        <f:else><em><f:translate key="{ll}widget.unassigned" /></em></f:else>
                                    </f:if>
                                </td>
                                <td class="text-nowrap">
                                    <span class="badge content-reminder-badge--{item.state}"><f:translate key="{ll}module.state.{item.state}" /></span>
                                </td>
                                <td class="col-control text-nowrap">
                                    <div class="btn-group">
                                        <f:if condition="{item.canComplete}">
                                            <button type="button" class="btn btn-default btn-sm" data-content-reminder-action="complete" data-uid="{item.reminder.uid}" data-title="{item.reminder.title}" data-recurring="{f:if(condition: item.recurrence, then: '1', else: '0')}" title="{f:translate(key: '{ll}panel.action.complete')}">
                                                <core:icon identifier="actions-check" size="small" />
                                            </button>
                                        </f:if>
                                        <f:if condition="{item.canTakeOver}">
                                            <button type="button" class="btn btn-default btn-sm" data-content-reminder-action="takeOver" data-uid="{item.reminder.uid}" title="{f:translate(key: '{ll}panel.action.takeOver')}">
                                                <core:icon identifier="actions-user" size="small" />
                                            </button>
                                        </f:if>
                                        <f:if condition="{item.canResume}">
                                            <button type="button" class="btn btn-default btn-sm" data-content-reminder-action="resume" data-uid="{item.reminder.uid}" title="{f:translate(key: '{ll}list.action.resume')}">
                                                <core:icon identifier="actions-play" size="small" />
                                            </button>
                                        </f:if>
                                        <f:if condition="{item.canReopen}">
                                            <button type="button" class="btn btn-default btn-sm" data-content-reminder-action="reopen" data-uid="{item.reminder.uid}" title="{f:translate(key: '{ll}list.action.reopen')}">
                                                <core:icon identifier="actions-refresh" size="small" />
                                            </button>
                                        </f:if>
                                        <f:if condition="{item.editUrl}">
                                            <a href="{item.editUrl}" class="btn btn-default btn-sm" title="{f:translate(key: '{ll}panel.action.edit')}">
                                                <core:icon identifier="actions-open" size="small" />
                                            </a>
                                        </f:if>
                                        <button type="button" class="btn btn-default btn-sm" data-content-reminder-history="{item.historyUrl}" title="{f:translate(key: '{ll}list.action.history')}">
                                            <core:icon identifier="actions-history" size="small" />
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <p class="text-body-secondary"><f:translate key="{ll}module.count" arguments="{0: '{items -> f:count()}'}" /></p>
        </f:then>
        <f:else>
            <f:be.infobox state="-1"><f:translate key="{ll}module.empty" /></f:be.infobox>
        </f:else>
    </f:if>
</f:section>

<f:section name="Archive">
    <f:if condition="{entries}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="{ll}history.completedAt" /></th>
                            <th><f:translate key="{ll}history.reminder" /></th>
                            <th><f:translate key="{ll}module.column.page" /></th>
                            <th><f:translate key="{ll}history.completedBy" /></th>
                            <th><f:translate key="{ll}history.dueDate" /></th>
                            <th><f:translate key="{ll}history.nextDueDate" /></th>
                            <th><f:translate key="{ll}history.comment" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{entries}" as="entry">
                            <tr>
                                <td class="text-nowrap"><f:format.date date="@{entry.completed_at}" format="{dateTimeFormat}" /></td>
                                <td>{entry.reminder_title}</td>
                                <td><a href="{entry.layoutUrl}">{entry.page_title}</a></td>
                                <td>{entry.completed_by_name}</td>
                                <td class="text-nowrap">
                                    <f:if condition="{entry.due_date}">
                                        <f:then><f:format.date date="{entry.due_date}" format="{dateFormat}" /></f:then>
                                        <f:else>–</f:else>
                                    </f:if>
                                </td>
                                <td class="text-nowrap">
                                    <f:if condition="{entry.next_due_date}">
                                        <f:then><f:format.date date="{entry.next_due_date}" format="{dateFormat}" /></f:then>
                                        <f:else>–</f:else>
                                    </f:if>
                                </td>
                                <td>{entry.comment -> f:format.nl2br()}</td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <p class="text-body-secondary"><f:translate key="{ll}module.count" arguments="{0: '{entries -> f:count()}'}" /></p>
        </f:then>
        <f:else>
            <f:be.infobox state="-1"><f:translate key="{ll}module.emptyArchive" /></f:be.infobox>
        </f:else>
    </f:if>
</f:section>
</html>
